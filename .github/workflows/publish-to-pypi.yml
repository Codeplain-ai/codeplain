name: Publish to PyPI

on:
  release:
    types: [published]

# Least privilege by default: jobs get no GITHUB_TOKEN scopes unless they
# opt in below.
permissions: {}

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs derives the version from git tags, so we need full history.
          fetch-depth: 0

      - name: Notify Slack (start)
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"*Codeplain Client*: Release \`${{ github.ref_name }}\` published by *${{ github.actor }}* — building and publishing to PyPI...\"}"

      - name: Install uv
        # uv provisions its own Python (honoring requires-python), so no
        # separate actions/setup-python step is needed.
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Inject PostHog analytics configuration
        # Substituted into the checkout only - never committed back. A source
        # checkout keeps the placeholders, so a clone reports no analytics.
        env:
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
          POSTHOG_CAPTURE_URL: ${{ vars.POSTHOG_CAPTURE_URL }}
        run: |
          set -euo pipefail

          # Fail loudly rather than ship an artifact that silently reports nothing.
          case "${POSTHOG_PROJECT_TOKEN:-}" in
            phc_*) ;;
            *) echo "::error::POSTHOG_PROJECT_TOKEN secret is missing or does not start with phc_"; exit 1 ;;
          esac
          case "${POSTHOG_CAPTURE_URL:-}" in
            https://*) ;;
            *) echo "::error::POSTHOG_CAPTURE_URL variable is missing or is not an https URL"; exit 1 ;;
          esac

          for f in analytics.py; do
            # '|' as the sed delimiter: the URL contains '/', the token cannot contain '|'.
            # Written through a temp file rather than with 'sed -i', which is not
            # portable, and copied back with 'cat' so the file keeps its mode.
            tmp="$(mktemp)"
            sed -e "s|__POSTHOG_PROJECT_TOKEN__|${POSTHOG_PROJECT_TOKEN}|g" \
                -e "s|__POSTHOG_CAPTURE_URL__|${POSTHOG_CAPTURE_URL}|g" \
                "$f" > "$tmp"
            cat "$tmp" > "$f"
            rm -f "$tmp"
            if grep -q "__POSTHOG_" "$f"; then
              echo "::error::$f still holds an unsubstituted PostHog placeholder"
              exit 1
            fi
            echo "Injected analytics configuration into $f"
          done

      - name: Build package
        # hatch-vcs reads the version straight from the release tag.
        run: |
          uv build
          echo "Built distributions:"
          ls -l dist/

      - name: Store the distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ github.ref_name }} dist/* --clobber

      - name: Notify Slack (build failure)
        if: ${{ failure() && env.SLACK_WEBHOOK_URL != '' }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"*Codeplain Client*: Build of \`${{ github.ref_name }}\` FAILED :x:. Nothing was published to PyPI. See <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|the run log>.\"}"

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/codeplain
    permissions:
      # Mint a short-lived OIDC token so PyPI Trusted Publishing can
      # authenticate this run — no long-lived API token needed.
      id-token: write

    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Notify Slack (success)
        if: ${{ success() && env.SLACK_WEBHOOK_URL != '' }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"*Codeplain Client*: \`${{ github.ref_name }}\` published to PyPI :white_check_mark:. Install with \`pip install --upgrade codeplain\`.\"}"

      - name: Notify Slack (failure)
        if: ${{ failure() && env.SLACK_WEBHOOK_URL != '' }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"*Codeplain Client*: Publishing \`${{ github.ref_name }}\` to PyPI FAILED :x:. See <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|the run log>.\"}"
