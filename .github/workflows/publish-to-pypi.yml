  #     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #       with:
  #         # The scan needs full history.
  #         fetch-depth: 0
  #
  #     # Non-fatal: the package is already published.
