name: Publish to PyPI

on:
  release:
    types: [published]

# Least privilege by default: jobs get no GITHUB_TOKEN scopes unless they
# opt in below.
permissions: {}

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # hatch-vcs derives the version from git tags, so we need full history.
          fetch-depth: 0

      # Non-fatal: Slack being down must not block the release.
      - name: Notify Slack (start)
        if: ${{ vars.SLACK_CHANNEL_ID != '' }}
        continue-on-error: true
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: ${{ vars.SLACK_CHANNEL_ID }}
            text: >-
              *Codeplain Client*: Release `${{ github.ref_name }}` published by *${{ github.actor }}*
              — building and publishing to PyPI...

      - name: Install uv
        # uv provisions its own Python (honoring requires-python), so no
        # separate actions/setup-python step is needed.
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build package
        # hatch-vcs reads the version straight from the release tag.
        run: |
          uv build
          echo "Built distributions:"
          ls -l dist/

      - name: Store the distribution packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ github.ref_name }} dist/* --clobber

      - name: Notify Slack (build failure)
        if: ${{ failure() && vars.SLACK_CHANNEL_ID != '' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: ${{ vars.SLACK_CHANNEL_ID }}
            text: >-
              *Codeplain Client*: Build of `${{ github.ref_name }}` FAILED :x:. Nothing was published to PyPI.
              See <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|the run log>.

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/codeplain
    permissions:
      # Mint a short-lived OIDC token so PyPI Trusted Publishing can
      # authenticate this run — no long-lived API token needed.
      id-token: write

    steps:
      # The tag (v0.4.0rc1) without its "v", for the install command in Slack.
      - name: Version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download distribution packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

      # GitHub marks the release itself as a pre-release; the tag (v0.4.0rc1)
      # carries the same intent for PEP 440. pip and uv skip pre-releases by
      # default, so "--upgrade" would NOT pick one up. Tell people the command
      # that actually works.
      - name: Notify Slack (pre-release published)
        if: ${{ success() && github.event.release.prerelease && vars.SLACK_CHANNEL_ID != '' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: ${{ vars.SLACK_CHANNEL_ID }}
            text: >-
              *Codeplain Client*: pre-release `${{ github.ref_name }}` published to PyPI :test_tube:.
              Normal installs are unaffected — try it with `pip install --pre codeplain==${{ steps.version.outputs.version }}`.

      - name: Notify Slack (release published)
        if: ${{ success() && !github.event.release.prerelease && vars.SLACK_CHANNEL_ID != '' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: ${{ vars.SLACK_CHANNEL_ID }}
            text: >-
              *Codeplain Client*: `${{ github.ref_name }}` published to PyPI :white_check_mark:.
              Install with `pip install --upgrade codeplain`.

      - name: Notify Slack (failure)
        if: ${{ failure() && vars.SLACK_CHANNEL_ID != '' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: ${{ vars.SLACK_CHANNEL_ID }}
            text: >-
              *Codeplain Client*: Publishing `${{ github.ref_name }}` to PyPI FAILED :x:.
              See <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|the run log>.

  # Release pipelines to be turned on only after the rest of the infrastructure
  # is ready.
  #
  # # Runs only after the package is on PyPI. Kept as its own job so the publish job
  # # keeps its minimal permissions and no checkout.
